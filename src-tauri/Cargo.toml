[package]
name = "gloss"
version = "0.1.0"
description = "Translate selected text from any app"
authors = ["Meoki"]
edition = "2024"
publish = false

[lib]
# Distinct from the bin name, see https://github.com/rust-lang/cargo/issues/8519
name = "gloss_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
enigo = "0.6.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
tauri-plugin-updater = "2.14.0"
eventsource-stream = "0.2.3"
futures-util = "0.3.34"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
